# One small web server for all the coming-soon pages.
# It picks the folder in sites/ that matches the domain the visitor typed (with or without www).
map $host $site {
    hostnames;
    default                 default;
    .smokieslocalguide.com  smokieslocalguide.com;
    .easttncs.com           easttncs.com;
    .kgene.me               kgene.me;
    .kgenemyers.com         kgenemyers.com;
    .rocinantestudio.com    rocinantestudio.com;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html/$site;
    index index.html;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.html;   # any unknown path shows the coming-soon page
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
